version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=tutortrack
      - POSTGRES_USER=tutortrack
      - POSTGRES_PASSWORD=tutortrack_password

  backend:
    build: ./backend
    restart: always
    command: /app/entrypoint.sh
    volumes:
      - ./backend:/app # Hot reload for code (except dependencies)
      - static_volume:/app/staticfiles
    expose:
      - 8000
    env_file:
      - .env
    environment:
      - DJANGO_ALLOWED_HOSTS=localhost 127.0.0.1 backend [::1]
      - SQL_ENGINE=django.db.backends.postgresql
      - SQL_DATABASE=tutortrack
      - SQL_USER=tutortrack
      - SQL_PASSWORD=tutortrack_password
      - SQL_HOST=db
      - SQL_PORT=5432
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles # Map django static files so Nginx can serve them
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  static_volume:
